# Pings the site twice a week (Mon & Thu) so the free database never sits idle long enough to pause.
# Set the repository variable SITE_URL (e.g. https://your-site.vercel.app) in GitHub > Settings > Variables.
name: Keep database awake
on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.SITE_URL }}/api/public/keepalive"
